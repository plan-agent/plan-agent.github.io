- id: project-7
  title: "项目7：基于小龙虾的无线智能体平台"
  description: >-
    面向无线通信方向学生、网络工程师、科研人员及相关从业者的在线智能问答与报告交付平台。项目依托“小龙虾”智能体能力，结合无线通信领域课程知识、标准文档、前沿论文和工程案例，打造专业、高效、可持续迭代的无线领域 AI 助手。主要功能包括课后习题解答、无线标准文档检索、最新无线论文速递、无线网络规划辅助及相关报告生成等。项目计划招募 2-3 名技术开发同学和 2 名项目推广与市场方向同学。
  students:
    - name: "陈泓帆"
      slug: "chen-hongfan"
      bio: >-
        会写 Python、C++ 和 Java；持有 HCIA-AI 华为人工智能认证，以及华为昇腾、鲲鹏大模型微认证。接触过大模型训练微调流程，会用 Copilot 辅助编程；参与过 app 用户页后端开发，熟悉 Java Spring Boot 框架。
    - name: "肖婧羽"
      slug: "xiao-jingyu"
      bio: >-
        擅长硬件编程与调试，做过三个嵌入式项目，熟悉无线通信硬件与软件相关知识。项目所需代码量大，具备较强代码编程和整合能力；硬件代码主要使用 C，熟练度高，会 Python、Java 和 Linux 简单部署。
