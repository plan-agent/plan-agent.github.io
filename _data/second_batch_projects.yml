        熟练掌握 C/C++、Python，获国家奖学金，主持国家级项目 2 项，学科竞赛多次获奖。具备底层数值算法到图形界面前端全栈开发项目经验，并申报软著；熟练掌握嵌入式通用外设通信协议，具有丰富 PCBA 硬件与代码联调经验，国家级项目已结题。
    - name: "李慧"
